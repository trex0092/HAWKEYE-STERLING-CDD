# Configuration for GitHub's automatically generated release notes.
# Groups merged PRs by label and hides noise. See:
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🐛 Bug fixes
      labels:
        - bug
        - fix
    - title: 🔒 Security
      labels:
        - security
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance & CI
      labels:
        - chore
        - ci
        - github-actions
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
