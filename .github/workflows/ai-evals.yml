name: AI evals

# Governance Layer 4 (Model & Agent Assurance): run the AI Co-pilot assurance
# tests — PII redaction, grounding / no-fabrication, and the human-oversight
# guardrails — on a schedule (drift watch) and whenever the AI code changes.

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/ai/**'
      - 'src/lib/integrations/aiCopilot.ts'
      - 'src/store/useAiCopilot.ts'
      - 'netlify/functions/ai-copilot.mts'
      - 'src/test/ai-copilot.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run AI assurance evals
        run: npx vitest run src/test/ai-copilot.test.ts
