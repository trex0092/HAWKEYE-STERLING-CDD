name: AI evals

# Governance Layer 4 (Model & Agent Assurance): run the AI Co-pilot assurance
# tests — PII redaction, grounding / no-fabrication, and the human-oversight
# guardrails — on a schedule (drift watch) and whenever the AI code changes.

on:
  schedule:
    # Weekly, Monday 05:00 UTC.
    - cron: '0 5 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/ai/**'
      - 'src/lib/integrations/aiCopilot.ts'
      - 'src/store/useAiCopilot.ts'
      - 'netlify/functions/ai-copilot.mts'
      - 'src/test/ai-copilot.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run AI assurance evals
        run: npx vitest run src/test/ai-copilot.test.ts
