name: Stale

# Keeps the issue and PR backlog tidy. Items with no activity are marked stale,
# then closed if still untouched. Security items and anything explicitly pinned
# or blocked are exempt.

on:
  schedule:
    - cron: '31 4 * * *' # daily, 04:31 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'security,pinned,blocked,in-progress'
          exempt-pr-labels: 'security,pinned,blocked,in-progress,dependencies'
          exempt-all-milestones: true
          stale-issue-message: >
            This issue has had no activity for 60 days and is now marked stale.
            Comment or update it within 14 days to keep it open; otherwise it
            will be closed automatically. It can always be reopened.
          stale-pr-message: >
            This pull request has had no activity for 60 days and is now marked
            stale. Push an update or comment within 14 days to keep it open;
            otherwise it will be closed automatically.
          close-issue-message: >
            Closing after 14 further days without activity. Please reopen if this
            is still relevant.
          close-pr-message: >
            Closing after 14 further days without activity. Please reopen when
            you are ready to continue.
