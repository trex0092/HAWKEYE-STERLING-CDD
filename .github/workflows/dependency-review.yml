name: Dependency Review

# Flags vulnerable or disallowed-licence dependencies introduced by a PR.
# Note: on a private repo this requires the Dependency Graph to be enabled
# (Settings → Code security → Dependency graph — free).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Dependency Review
        # Advisory: won't block PRs. Becomes a real gate once the repo's
        # Dependency Graph is enabled (Settings → Code security).
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
