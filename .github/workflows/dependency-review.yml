name: Dependency Review

# Flags vulnerable or disallowed-licence dependencies introduced by a PR.
# Advisory until the Dependency Graph is enabled (Settings → Code security — free):
# the action errors without it, so it must not block. Once enabled, drop
# continue-on-error below to make this a real gate.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # post the review summary comment on failure

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        # Advisory until Dependency Graph is enabled (see header). Then remove this.
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
