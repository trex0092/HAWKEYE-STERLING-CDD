name: Security scan

# Aggressive, continuously-run security scanning that feeds the repository's
# Security dashboard (code scanning):
#   • Trivy    — dependency vulnerabilities + IaC/config misconfigurations
#   • Zizmor   — static security audit of the GitHub Actions workflows themselves
#   • SBOM     — CycloneDX software bill of materials, published as an artifact
#
# Zizmor is a BLOCKING gate: a new insecure workflow fails CI. Trivy stays
# advisory (SARIF into the Security tab) so a transient upstream CVE doesn't
# block unrelated PRs — Dependabot + Dependency Review gate dependencies.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC

# Least privilege at the top level; jobs elevate only what they need.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy vulnerability & misconfig scan
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository to scan
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0' # report-only; findings surface in the Security tab

      - name: Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  zizmor:
    name: Zizmor workflow security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the workflows to audit
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # Blocking gate: fails CI on a workflow-security finding (baseline is clean).
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
