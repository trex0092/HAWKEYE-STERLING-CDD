name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard supply-chain security analysis and publishes the
# results so the README badge and code-scanning dashboard reflect the repo's
# security posture (branch protection, pinned actions, token permissions, …).
# https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    - cron: '18 5 * * 1' # weekly, Monday 05:18 UTC
  push:
    branches: [main]

# Least-privilege by default; the job elevates only what Scorecard needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: results.sarif
