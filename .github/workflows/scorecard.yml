name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard supply-chain security analysis and publishes the
# results so the README badge and code-scanning dashboard reflect the repo's
# security posture (branch protection, pinned actions, token permissions, …).
# https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    - cron: '18 5 * * 1' # weekly, Monday 05:18 UTC
  push:
    branches: [main]

# Least-privilege by default; the job elevates only what Scorecard needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
