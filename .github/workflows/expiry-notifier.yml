name: Expiry notifier

# Reads customer assessment descriptions from the Asana "Customer Database"
# project and files follow-up tasks for anything expired or overdue, so the
# reminders land in Asana (Inbox + My Tasks). No email; no Asana date columns.
#
# Required secret:  ASANA_TOKEN   Asana Personal Access Token. That is the ONLY
#                   thing you must add — every project/assignee id is baked into
#                   scripts/expiry-notifier.mjs as a default.
# Optional vars:    only if you ever want to override a default (RENEWALS_PROJECT_GID,
#                   ASSIGNEE_GID, ASANA_PROJECT_GID, REVIEW_INTERVAL_MONTHS, TIMEZONE).

on:
  schedule:
    # Daily at 04:40 UTC = 08:40 Asia/Dubai (UTC+4).
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print what would be created without writing to Asana'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: expiry-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Run expiry notifier
        run: node scripts/expiry-notifier.mjs
        env:
          # The only required secret. Project, assignee and workspace ids are
          # baked into the script as defaults, so nothing else is needed.
          # Accepts either secret name (this repo uses ASANA_ACCESS_TOKEN).
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
