name: Labeler

# Applies path-based labels to pull requests using .github/labeler.yml.
# pull_request_target lets forked PRs be labelled with a read-scoped default token.

on:
  # zizmor: ignore[dangerous-triggers] — labels only; never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
