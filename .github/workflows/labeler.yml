name: Labeler

# Applies path-based labels to pull requests using .github/labeler.yml.
# pull_request_target lets forked PRs be labelled with a read-scoped default token.

on:
  # zizmor: ignore[dangerous-triggers] — labels only; never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          sync-labels: true
